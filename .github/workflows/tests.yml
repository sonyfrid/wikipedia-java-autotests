name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # раз в неделю: Википедия меняется, тесты должны это ловить

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: API-тесты
        run: mvn -B -Papi test
      - name: Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: browser-actions/setup-chrome@v2
      - name: UI-тесты (headless Chrome)
        run: mvn -B -Pui test
      - name: Allure results и скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: |
            target/allure-results
            target/selenide-reports
